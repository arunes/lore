name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore Lore.App/Lore.App.csproj

      - run: dotnet build Lore.App/Lore.App.csproj --no-restore

      - run: dotnet test Lore.UnitTests

      - run: dotnet format style Lore.App/Lore.App.csproj --verify-no-changes --no-restore

      - run: dotnet format analyzers Lore.App/Lore.App.csproj --verify-no-changes --no-restore

  publish:
    runs-on: ubuntu-latest
    needs: build-and-format
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lore:latest
