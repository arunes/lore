name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore Lore.App/Lore.App.csproj

      - run: dotnet build Lore.App/Lore.App.csproj --no-restore

      - run: dotnet format style Lore.App/Lore.App.csproj --verify-no-changes --no-restore

      - run: dotnet format analyzers Lore.App/Lore.App.csproj --verify-no-changes --no-restore